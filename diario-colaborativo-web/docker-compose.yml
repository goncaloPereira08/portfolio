version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=asw_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always 
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads 
    environment:
      - DATABASE_URL=postgresql://root:password@db:5432/asw_db?schema=public
      - JWT_SECRET=${JWT_SECRET:-muda_esta_chave}
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:80"

volumes:
  pgdata: